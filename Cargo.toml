[package]
name = "radd-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A guided cross-platform desktop interface for PNNL RADD"
license = "MIT"
repository = "https://github.com/DoneByAP/radd-desktop"
readme = "README.md"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "persistence"] }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

[features]
ui-capture = ["dep:image"]

[profile.release]
strip = true

